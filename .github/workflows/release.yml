name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [windows, linux, darwin]
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.25.6
          check-latest: false

      - name: Determine file extension
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          echo "EXT=$EXT" >> $GITHUB_ENV

      - name: Build binary
        run: |
          echo "Building for ${{ matrix.os }} / ${{ matrix.arch }}"
          mkdir -p dist
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -o dist/nosaurus$EXT .

      - name: Zip binary
        run: |
          cd dist
          ZIP="nosaurus-${{ matrix.os }}-${{ matrix.arch }}.zip"
          zip -r $ZIP nosaurus$EXT
          cd ..

      - name: Generate checksum
        run: |
          cd dist
          SHA="nosaurus-${{ matrix.os }}-${{ matrix.arch }}.sha256"
          shasum -a 256 nosaurus-${{ matrix.os }}-${{ matrix.arch }}.zip > $SHA
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nosaurus-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/nosaurus-${{ matrix.os }}-${{ matrix.arch }}.zip
            dist/nosaurus-${{ matrix.os }}-${{ matrix.arch }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: dist/**/*.zip,dist/**/*.sha256
